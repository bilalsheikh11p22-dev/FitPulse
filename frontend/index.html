<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a0f" />
    <meta name="description" content="FitPulse - track workouts, nutrition and progress in one beautiful dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <title>FitPulse | Train Smarter. Track Everything.</title>
    <script>
      try { if (localStorage.getItem('fitpulse_theme') === 'light') document.documentElement.classList.remove('dark'); } catch (e) {}
    </script>
    <style>
      #fp-splash{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#080a0f;color:#fff;transition:opacity .35s ease}
      html:not(.dark) #fp-splash{background:#f4f6fa;color:#0f131c}
      #fp-splash.fp-hide{opacity:0;pointer-events:none}
      #fp-splash .r{position:relative;width:88px;height:88px;display:grid;place-items:center}
      #fp-splash svg.arc{position:absolute;inset:0;animation:fps 1.1s cubic-bezier(.55,.15,.45,.85) infinite}
      #fp-splash .w{margin-top:20px;font:800 22px 'Plus Jakarta Sans',Inter,system-ui,sans-serif;letter-spacing:-.03em}
      #fp-splash .w span{font-weight:500}
      #fp-splash .b{margin-top:18px;width:140px;height:3px;border-radius:3px;background:rgba(128,138,155,.25);overflow:hidden}
      #fp-splash .b i{display:block;width:34%;height:100%;border-radius:3px;background:linear-gradient(90deg,#ff6b2c,#ffb020);animation:fpb 1.4s ease-in-out infinite}
      @keyframes fpb{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
      @keyframes fps{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased">
    <div id="root"></div>
    <div id="fp-splash" role="status" aria-label="Loading FitPulse">
      <div class="r">
        <svg class="arc" viewBox="0 0 100 100" width="88" height="88" aria-hidden="true">
          <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b2c"/><stop offset="1" stop-color="#ffb020"/></linearGradient></defs>
          <circle cx="50" cy="50" r="44" fill="none" stroke="rgba(128,138,155,.25)" stroke-width="3"/>
          <circle cx="50" cy="50" r="44" fill="none" stroke="url(#g)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="77 277" style="transform-origin:50% 50%"/>
        </svg>
        <svg viewBox="4.75 4 40 40" width="38" height="38" aria-hidden="true">
          <path fill="currentColor" fill-rule="evenodd" d="M9 5h19.5a11.5 11.5 0 0 1 0 23H17v14H9zM17 12v9h11.5a4.5 4.5 0 0 0 0-9z"/>
          <path fill="#ff6b2c" d="M22 43l10-10h8.5L30.5 43z"/>
        </svg>
      </div>
      <div class="w">Fit<span>Pulse</span></div>
      <div class="b"><i></i></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
